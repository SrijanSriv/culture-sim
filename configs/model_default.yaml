# Model configuration (SPEC §4).
#
# `free` holds the 8 fitted parameters of SPEC §4.4 -- the values here are the
# hand-tuned Task 1 starting point, not a fit result. `fixed` holds parameters
# taken from the literature; each carries its source, and the same citations
# appear next to the defaults in culturesim/model/params.py.

seed: 20250819 # master seed; all randomness derives from this (SPEC §11)

network:
  n_neurons: 1000 # SPEC §4.3: burst statistics are unstable below ~800
  excitatory_fraction: 0.8
  # 2-D sheet matching the MCS 60-electrode sensing area: 8x8 grid at 200 um
  # pitch spans 1400 um, padded to 1800 um so edge neurons are still observed.
  sheet_width_um: 1800.0
  sheet_height_um: 1800.0
  allow_autapses: false
  allow_multapses: false

free:
  # Hand-tuned Task 1 starting point, found with scripts/tune_task1.py. Gives network
  # bursts about every 10 s with a near-silent baseline between them (0.007 Hz/neuron).
  # NOT a fit result -- Tasks 5 and 6 replace these.
  #
  # Three of these are sharp and worth understanding before changing them:
  #   rate_bg sets the mean background depolarisation to ~15.8 mV against a 20 mV
  #   rest-to-threshold gap, so the network idles just below threshold and bursts are
  #   fluctuation-triggered. The window is narrow: 4.41 Hz is silent, 5.35 Hz is
  #   continuously active with no quiet periods.
  #   g must stay low. By g = 4 excitation and inhibition balance, which suppresses
  #   synchrony into an asynchronous irregular state with no bursts at all.
  #   tau_rec sets the inter-burst interval, since what ends a burst is depleted
  #   synaptic resources and what permits the next one is their recovery.
  p_conn: 0.20 # 1
  w_e: 1.5 # mV, EPSP amplitude at a rested synapse (u=U, x=1)
  g: 2.0 # 1, inhibitory/excitatory weight ratio
  rate_bg: 4.98 # Hz, per-afferent rate; x n_background_synapses afferents per neuron
  tau_m: 20.0 # ms
  U: 0.25 # 1, STP utilisation
  tau_rec: 2500.0 # ms, STP recovery; this is what sets the inter-burst interval
  b: 2.5 # mV, adaptation increment per spike

# Uniform prior box for SBI (SPEC §4.4) and bounds for the coarse optimiser.
priors:
  p_conn: [0.01, 0.30]
  w_e: [0.05, 3.0]
  g: [1.0, 12.0]
  rate_bg: [0.1, 20.0]
  tau_m: [10.0, 40.0]
  U: [0.05, 0.8]
  tau_rec: [100.0, 5000.0]
  b: [0.0, 5.0]

fixed:
  # Neuron (SPEC §4.1)
  E_L: -70.0 # mV  -- resting potential, cortical pyramidal; Dayan & Abbott 2001, ch. 5
  v_th: -50.0 # mV  -- LIF spike threshold; Brette & Gerstner 2005
  v_reset: -60.0 # mV  -- reset potential; Brunel 2000, J Comput Neurosci 8:183
  t_ref: 2.0 # ms  -- absolute refractory period; Brunel 2000
  tau_e: 5.0 # ms  -- AMPA-mediated decay; Destexhe, Mainen & Sejnowski 1998
  tau_i: 10.0 # ms  -- GABA_A-mediated decay; Destexhe, Mainen & Sejnowski 1998
  tau_a: 200.0 # ms  -- Ca-dependent K adaptation; Benda & Herz 2003, Neural Comput 15:2523
  # Synapse (SPEC §4.2)
  tau_f: 100.0 # ms  -- TM facilitation; Tsodyks & Markram 1997, PNAS 94:719
  # Background drive (SPEC §4.3). External afferents per neuron, each at `rate_bg`;
  # Brunel 2000 uses C_ext = C_E = 1000. Neither constant is in SPEC §4.4, and both are
  # required -- with one afferent per neuron the network is silent across the whole
  # `rate_bg` prior, and with the background amplitude tied to `w_e` no sparse-baseline
  # bursting regime exists at all. See the comment in culturesim/model/params.py.
  n_background_synapses: 1000
  w_background: 0.1 # mV, EPSP amplitude of a single background afferent
  # Topology (SPEC §4.3)
  lambda_conn_fraction_of_width: 0.3333333333 # SPEC §4.4: one third of array width
  synaptic_delay_ms: [1.0, 3.0] # uniform axonal delay; Wagenaar et al. 2006, BMC Neurosci 7:11

simulation:
  duration_s: 300.0 # biological time; must complete in <60 s wall-clock (SPEC §4.5)
  # 0.2 ms is the budget decision: poisson + 0.1 ms projects to 58.5 s for 300 s
  # biological (inside the 60 s cap, not "well under"); 0.2 ms projects to 42.1 s.
  # Burst/avalanche analysis bins are 50 ms, so this does not coarsen the fingerprint.
  dt_ms: 0.2
  transient_s: 20.0 # discarded warm-up, excluded from `duration` of the output
  static_synapses: false # true reproduces the Task 1 ablation (SPEC §13)
  record_neuron_positions: true # needed by the virtual MEA
  # Exact Poisson afferents (SPEC §4.3). Diffusion is a slower, statistically
  # different approximation; do not switch it on to chase the runtime budget.
  background_mode: poisson

runner:
  build_root: null # null -> system temp dir; each run gets its own subdirectory
  n_workers: null # null -> cpu_count() - 1
  timeout_s: 600
  keep_build_dir: false
